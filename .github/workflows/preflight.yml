name: Preflight

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  attestation:
    name: Pre-PR attestation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify pre-PR gate belongs to current HEAD and base
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-body.txt"
          # The checker and the tier classifier it sources both ship from the
          # trusted base now that PRs #659 (base-controlled checker) and #741
          # (tier classifier) are merged, so the trusted-base path always has
          # both files; never fall back to a PR's own copy, since that would
          # let a change supply the rules that judge its own attestation.
          if git show "$PR_BASE_SHA:scripts/check-pr-preflight.sh" > "$RUNNER_TEMP/check-pr-preflight.sh" 2>/dev/null; then
            chmod +x "$RUNNER_TEMP/check-pr-preflight.sh"
            if git show "$PR_BASE_SHA:scripts/pr-tier.sh" > "$RUNNER_TEMP/pr-tier.sh" 2>/dev/null; then
              chmod +x "$RUNNER_TEMP/pr-tier.sh"
            else
              echo "trusted base has no tier classifier" >&2
              exit 1
            fi
          else
            echo "trusted base has no preflight checker" >&2
            exit 1
          fi
          "$RUNNER_TEMP/check-pr-preflight.sh" \
            "$PR_HEAD_SHA" "$PR_BASE_REF" "$PR_BASE_SHA" "$RUNNER_TEMP/pr-body.txt"
