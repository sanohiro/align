name: Preflight

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  attestation:
    name: Pre-PR attestation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history, not a shallow clone: the attestation binds the merge
          # base of the PR head and the base branch, and `git merge-base` needs
          # both sides' history to compute it.
          fetch-depth: 0

      - name: Verify pre-PR gate belongs to current HEAD and base
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-body.txt"
          # Trusted machinery is fetched from the live tip of the default
          # branch, `refs/remotes/origin/main`. Two sources are deliberately
          # rejected:
          #
          #   * `github.event.pull_request.base.sha`. That payload field is
          #     frozen when the PR is opened, and rerun, edited, and
          #     close/reopen all replay the same payload rather than refreshing
          #     it, so a merged fix to the machinery never reaches an
          #     already-open PR. PR #746 (2026-08-11) is the demonstration: the
          #     then-current checker compared the frozen base.sha (ef76fbb)
          #     verbatim against the body's base marker, which recorded the
          #     fork point the author's local origin/main pointed at (75e869d).
          #     The mismatch was permanent, and recreating the PR was the only
          #     remedy.
          #   * the PR's own base branch tip. A stacked PR targets an
          #     author-controlled branch, so fetching from there would let a
          #     push to that base swap out the rules that judge the PR. main
          #     moves only by merge, so it is the one trustworthy source.
          #
          # This reverses the direction of skew rather than removing it. Before:
          # a frozen machinery snapshot judged a current body, unrecoverably —
          # the only fix was recreating the PR. Now: current machinery judges a
          # possibly stale body, which the author fixes by rebasing, rerunning
          # scripts/pre-pr.sh, and refreshing the PR with
          # scripts/open-pr.sh --update. Two windows remain: re-running an
          # existing run replays that run's own workflow file, and an open PR
          # that is itself editing this file is judged by its merge-ref copy.
          #
          # Machinery that main does not have yet is absent from this tip too,
          # so a PR introducing new trusted machinery still needs its one-PR
          # bootstrap arm keyed on its own number; the live tip only guarantees
          # that already-merged machinery reaches every open PR at once.
          #
          # The checkout above is fetch-depth: 0, so origin/main is present and
          # current. Fail closed when it is not, and re-check the shape: an
          # empty variable would turn the `git show` below into `":scripts/..."`,
          # an index read of the PR's own checkout — the PR supplying its judge.
          if ! TRUSTED_TIP_SHA="$(git rev-parse --verify --quiet "refs/remotes/origin/main^{commit}")"; then
            echo "cannot resolve the live tip of origin/main" >&2
            echo "  (this job needs the checkout above to keep fetch-depth: 0)" >&2
            exit 1
          fi
          [[ "$TRUSTED_TIP_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "origin/main resolved to no usable SHA: '$TRUSTED_TIP_SHA'" >&2
            exit 1
          }
          echo "trusted machinery source: origin/main = $TRUSTED_TIP_SHA"
          # The checker and the tier classifier it sources both ship from the
          # trusted branch now that PRs #659 (base-controlled checker) and #741
          # (tier classifier) are merged, so the trusted path always has both
          # files; never fall back to a PR's own copy, since that would let a
          # change supply the rules that judge its own attestation.
          if git show "$TRUSTED_TIP_SHA:scripts/check-pr-preflight.sh" > "$RUNNER_TEMP/check-pr-preflight.sh" 2>/dev/null; then
            chmod +x "$RUNNER_TEMP/check-pr-preflight.sh"
            if git show "$TRUSTED_TIP_SHA:scripts/pr-tier.sh" > "$RUNNER_TEMP/pr-tier.sh" 2>/dev/null; then
              chmod +x "$RUNNER_TEMP/pr-tier.sh"
            else
              echo "origin/main has no tier classifier" >&2
              exit 1
            fi
          else
            echo "origin/main has no preflight checker" >&2
            exit 1
          fi
          # The attestation binds the branch's merge base with its base branch,
          # not any branch tip. Resolve that from the live remote-tracking ref
          # as well: the frozen `base.sha` object may be missing from this
          # checkout entirely after a force-push to the base branch, which would
          # fail the job for a PR that is perfectly attested. This value is
          # informational — since #748 the checker derives the same merge base
          # from the checked-out base branch itself and only shape-checks this
          # argument, precisely because this workflow file is the PR's own copy.
          if ! MERGE_BASE_SHA="$(git merge-base "$PR_HEAD_SHA" "refs/remotes/origin/$PR_BASE_REF")"; then
            echo "cannot compute the merge base of $PR_HEAD_SHA and origin/$PR_BASE_REF" >&2
            echo "  (this job needs the checkout above to keep fetch-depth: 0)" >&2
            exit 1
          fi
          [[ "$MERGE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "merge-base returned no usable SHA: '$MERGE_BASE_SHA'" >&2
            exit 1
          }
          echo "attestation base: merge-base($PR_HEAD_SHA, origin/$PR_BASE_REF) = $MERGE_BASE_SHA"
          "$RUNNER_TEMP/check-pr-preflight.sh" \
            "$PR_HEAD_SHA" "$PR_BASE_REF" "$MERGE_BASE_SHA" "$RUNNER_TEMP/pr-body.txt"
