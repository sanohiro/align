name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v0.1.0)"
        required: true

permissions:
  contents: read

env:
  RUST_VERSION: 1.96.0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: alignc-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: alignc-linux-aarch64
          - os: macos-15
            artifact: alignc-macos-aarch64
    runs-on: ${{ matrix.os }}
    env:
      ALIGN_APT_PACKAGES: >-
        llvm-22-dev clang-22 libclang-rt-22-dev lld-22
        libpq-dev libssl-dev zlib1g-dev libzstd-dev
      # Fail closed on the linker per platform, same rule as ci.yml: the PGO
      # training phase links the whole examples/pkg.db corpus, so a missing
      # lld-22 would quietly make a release build slower rather than fail.
      ALIGNC_LINKER: ${{ startsWith(matrix.os, 'ubuntu') && 'lld' || 'system' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate release version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          VERSION="${TAG#v}"
          CARGO_VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test "$TAG" = "v$VERSION"
          test "$VERSION" = "$CARGO_VERSION" || {
            echo "tag version $VERSION does not match Cargo workspace version $CARGO_VERSION" >&2
            exit 1
          }

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          # llvm-tools supplies the toolchain's own llvm-profdata, guaranteeing
          # the profraw/profdata format matches rustc's bundled LLVM (a system
          # llvm-profdata can silently mismatch across version bumps).
          rustup component add llvm-tools

      - name: Install LLVM and native libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # No cache around it: a release artifact must never link a toolchain
          # that only a cache entry still has. Same script as CI, so the
          # package set and the repository definition cannot drift. --uncached
          # also drops the resolved archives afterwards, which matters on a
          # runner already holding two PGO build directories.
          if [ -x scripts/ci-pgdg.sh ]; then
            scripts/ci-pgdg.sh
          else
            # workflow_dispatch may rebuild a tag created before ci-pgdg.sh
            # existed. Keep the current workflow's dependency floor usable
            # without requiring the historical source tree to contain current
            # release machinery.
            PGDG_KEY="$RUNNER_TEMP/pgdg.asc"
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$PGDG_KEY"
            FINGERPRINTS="$(gpg --show-keys --with-colons "$PGDG_KEY" 2>/dev/null \
              | awk -F: '$1 == "fpr" { print $10 }')"
            printf '%s\n' "$FINGERPRINTS" \
              | grep -qxF B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
            CODENAME="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
            ARCHITECTURE="$(dpkg --print-architecture)"
            sudo install -d -m 0755 /etc/apt/keyrings
            sudo install -m 0644 "$PGDG_KEY" /etc/apt/keyrings/align-pgdg.asc
            printf 'deb [arch=%s signed-by=%s] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' \
              "$ARCHITECTURE" /etc/apt/keyrings/align-pgdg.asc "$CODENAME" \
              | sudo tee /etc/apt/sources.list.d/align-pgdg.list >/dev/null
          fi
          scripts/ci-apt-llvm.sh install --uncached
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=/usr/lib/llvm-22/bin/llvm-config" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Install LLVM and native libraries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm@22 openssl@3 libpq zstd
          LLVM_PREFIX="$(brew --prefix llvm@22)"
          LIBPQ_PREFIX="$(brew --prefix libpq)"
          echo "LLVM_SYS_221_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=$LLVM_PREFIX/bin/llvm-config" >> "$GITHUB_ENV"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$LIBPQ_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LIBRARY_PATH=$LIBPQ_PREFIX/lib:$(brew --prefix openssl@3)/lib:$(brew --prefix zstd)/lib" >> "$GITHUB_ENV"

      - name: Verify libpq client baseline
        shell: bash
        run: |
          if [ -x scripts/check-libpq-version.sh ]; then
            scripts/check-libpq-version.sh
          else
            # Historical tags do not use the new streamed-delivery symbols,
            # but the current release environment still guarantees libpq 17.
            LIBPQ_VERSION="$(pg_config --version | awk '{ print $2 }')"
            LIBPQ_MAJOR="${LIBPQ_VERSION%%.*}"
            test "$LIBPQ_MAJOR" -ge 17
            echo "libpq client version: $LIBPQ_VERSION (historical-tag fallback)"
          fi

      # Two-phase PGO: a compiler is a branch-heavy workload, so profile-guided
      # layout stacks a measured 5-15% frontend win on top of dist's thin LTO.
      # Only the tagged-release flow pays the double build; every phase below
      # was first validated locally end to end on the same corpus.
      - name: Build instrumented compiler (PGO phase 1)
        shell: bash
        run: |
          # The runtime is linked into programs emitted during training. Keep
          # it uninstrumented: only alignc owns this compiler profile.
          CARGO_TARGET_DIR=target/pgogen \
            scripts/cargo.sh build --locked --profile dist -p align_runtime
          RUSTFLAGS="-Cprofile-generate=$RUNNER_TEMP/pgo-data" \
          CARGO_TARGET_DIR=target/pgogen \
            scripts/cargo.sh build --locked --profile dist -p align_driver

      - name: Collect compilation profile (PGO phase 2)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pgo-cwd"
          cd "$RUNNER_TEMP/pgo-cwd"
          # Canary WITHOUT || true: instrumented build scripts also write
          # profraw during phase 1, so a non-empty merge glob proves nothing.
          # At least one real compiler run must demonstrably succeed or the
          # release must fail here, not ship a build-script-noise profile.
          "$GITHUB_WORKSPACE/target/pgogen/dist/alignc" build \
            "$GITHUB_WORKSPACE/examples/hello.align" >/dev/null
          for f in "$GITHUB_WORKSPACE"/examples/*.align; do
            "$GITHUB_WORKSPACE/target/pgogen/dist/alignc" build "$f" >/dev/null 2>&1 || true
          done
          # The check corpus intentionally exits non-zero (it emits diagnostics);
          # guard its presence so a workflow_dispatch on an older tag stays valid.
          if [ -f "$GITHUB_WORKSPACE/apps/db/pkg/db.align" ]; then
            for _ in 1 2 3 4 5; do
              "$GITHUB_WORKSPACE/target/pgogen/dist/alignc" check \
                "$GITHUB_WORKSPACE/apps/db/pkg/db.align" >/dev/null 2>&1 || true
            done
          fi
          # The toolchain's own llvm-profdata (see Install Rust), never the
          # system one: the format must match rustc's bundled LLVM.
          PROFDATA="$(find "$(rustc --print sysroot)" -name llvm-profdata -type f | head -1)"
          test -n "$PROFDATA"
          "$PROFDATA" merge -o "$RUNNER_TEMP/merged.profdata" "$RUNNER_TEMP/pgo-data"/*.profraw

      - name: Build compiler (PGO phase 3)
        shell: bash
        run: |
          scripts/cargo.sh build --locked --profile dist -p align_runtime
          # `align_repl` builds in the SAME invocation as `align_driver`, not a
          # separate one: RUSTFLAGS is part of cargo's fingerprint, so a second
          # build without `-Cprofile-use` would recompile the whole profiled
          # dependency tree rather than reuse it. The REPL is not instrumented in
          # phase 1 and contributes no training corpus of its own — it is a thin
          # shell whose compile work happens inside the driver library that IS
          # profiled, so its own functions simply carry no profile data.
          #
          # BUT `align_repl` depends on `align_runtime` and `align_driver` does
          # not, so selecting it under the profile-use RUSTFLAGS rebuilds the
          # archive as a different fingerprint and uplifts it over the copy just
          # built. Stash the uninstrumented archive and put it back afterwards:
          # the packaged runtime must stay outside compiler-training
          # instrumentation (docs/impl/11-release-distribution.md), because
          # alignc links it into the programs compiled during training. Restoring
          # explicitly rather than reordering keeps this independent of whether
          # cargo re-uplifts an already-fresh artifact.
          cp target/dist/libalign_runtime.a "$RUNNER_TEMP/libalign_runtime.a"
          RUSTFLAGS="-Cprofile-use=$RUNNER_TEMP/merged.profdata" \
            scripts/cargo.sh build --locked --profile dist -p align_driver -p align_repl
          cp "$RUNNER_TEMP/libalign_runtime.a" target/dist/libalign_runtime.a

      - name: Smoke test compiler
        shell: bash
        run: |
          ./target/dist/alignc --version
          ./target/dist/alignc build examples/hello.align
          ./hello
          # The REPL drives the same driver and locates libalign_runtime.a beside
          # its own executable, so this proves the shipped pair works together —
          # not just that the binary starts.
          ./target/dist/align-repl --version
          printf '40 + 2\n:quit\n' | ./target/dist/align-repl | grep -x 42

      - name: Create and verify archive
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p package
          cp target/dist/alignc package/
          cp target/dist/align-repl package/
          cp target/dist/libalign_runtime.a package/
          cp LICENSE-APACHE LICENSE-MIT README.md README.ja.md package/
          ARCHIVE_MEMBERS=(
            alignc align-repl libalign_runtime.a
            LICENSE-APACHE LICENSE-MIT README.md README.ja.md
          )
          if [[ -x scripts/build-prebuilt-cache.sh && \
                -x scripts/verify-prebuilt-cache-layout.sh ]]; then
            mkdir -p package/share/align/cache/1
            scripts/build-prebuilt-cache.sh \
              package/alignc package/share/align/cache/1
            scripts/verify-prebuilt-cache-layout.sh package
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum package/alignc | awk '{ print $1 }' > "$RUNNER_TEMP/packaged-alignc.sha256"
            else
              shasum -a 256 package/alignc | awk '{ print $1 }' > "$RUNNER_TEMP/packaged-alignc.sha256"
            fi
            ARCHIVE_MEMBERS+=(share)
          else
            echo "historical tag: prebuilt-cache release machinery is absent"
          fi
          tar -C package -czf "$ARTIFACT.tar.gz" "${ARCHIVE_MEMBERS[@]}"

      - name: Verify real Homebrew installation
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          if [[ ! -x scripts/verify-prebuilt-cache-layout.sh ]]; then
            echo "historical tag: skipping prebuilt-cache Homebrew verification"
            exit 0
          fi
          VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          ARCHIVE="$GITHUB_WORKSPACE/$ARTIFACT.tar.gz"
          ARCHIVE_SHA="$(shasum -a 256 "$ARCHIVE" | awk '{ print $1 }')"
          sed -e "s|{{VERSION}}|$VERSION|g" \
              -e "s|{{URL_MACOS_ARM}}|file://$ARCHIVE|g" \
              -e "s|{{SHA_MACOS_ARM}}|$ARCHIVE_SHA|g" \
              .github/align.rb.template > "$RUNNER_TEMP/align.rb"
          brew install --formula --build-from-source "$RUNNER_TEMP/align.rb"
          FORMULA_ROOT="$(brew --prefix align)/libexec"
          test "$(shasum -a 256 "$FORMULA_ROOT/alignc" | awk '{ print $1 }')" = \
            "$(cat "$RUNNER_TEMP/packaged-alignc.sha256")"
          scripts/verify-prebuilt-cache-layout.sh "$FORMULA_ROOT"
          brew uninstall align

      - name: Measure prebuilt cache
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          if [[ ! -x bench/prebuilt_cache/run.sh ]]; then
            echo "historical tag: skipping prebuilt-cache measurement"
            exit 0
          fi
          bench/prebuilt_cache/run.sh package "$ARTIFACT.tar.gz" \
            "$ARTIFACT.prebuilt-cache.md"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.prebuilt-cache.md
          if-no-files-found: error

  publish:
    name: Package and publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HAS_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      HAS_APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Collect release archives
        shell: bash
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp '{}' release/ \;

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Debian packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          for SPEC in "amd64:x86_64" "arm64:aarch64"; do
            DEB_ARCH="${SPEC%%:*}"
            ARCHIVE_ARCH="${SPEC##*:}"
            ROOT="deb-$DEB_ARCH"
            mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/lib/align" \
              "$ROOT/usr/share/doc/alignc"
            ARCHIVE="release/alignc-linux-$ARCHIVE_ARCH.tar.gz"
            ARCHIVE_MEMBERS=(alignc align-repl libalign_runtime.a)
            tar -tzf "$ARCHIVE" > "$RUNNER_TEMP/$DEB_ARCH.archive-members"
            if grep -q '^share/' "$RUNNER_TEMP/$DEB_ARCH.archive-members"; then
              ARCHIVE_MEMBERS+=(share)
            fi
            tar -xzf "$ARCHIVE" -C "$ROOT/usr/lib/align" "${ARCHIVE_MEMBERS[@]}"
            cat > "$ROOT/usr/bin/alignc" <<'EOF'
          #!/bin/sh
          exec /usr/lib/align/alignc "$@"
          EOF
            chmod 0755 "$ROOT/usr/bin/alignc"
            # align-repl resolves libalign_runtime.a beside its OWN executable, so
            # it has to live in /usr/lib/align next to the archive and be reached
            # through a wrapper, exactly like alignc — a /usr/bin symlink would
            # still resolve, but keeping the two identical means one shape to
            # reason about.
            cat > "$ROOT/usr/bin/align-repl" <<'EOF'
          #!/bin/sh
          exec /usr/lib/align/align-repl "$@"
          EOF
            chmod 0755 "$ROOT/usr/bin/align-repl"
            cp LICENSE-APACHE LICENSE-MIT README.md README.ja.md "$ROOT/usr/share/doc/alignc/"
            cat > "$ROOT/DEBIAN/control" <<EOF
          Package: alignc
          Version: $VERSION
          Section: devel
          Priority: optional
          Architecture: $DEB_ARCH
          Maintainer: sanohiro
          Depends: llvm-22, clang-22, libclang-rt-22-dev, libpq-dev, libssl-dev, zlib1g-dev, libzstd-dev
          Description: AOT compiler for the Align programming language
           Align is a data-oriented language with predictable native performance.
           Ships alignc and align-repl, an AOT REPL that compiles and runs each
           entry natively.
          EOF
            dpkg-deb --root-owner-group --build "$ROOT" "release/alignc_${VERSION}_${DEB_ARCH}.deb"
          done

      - name: Generate Homebrew formula
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA_MACOS_ARM="$(sha256sum release/alignc-macos-aarch64.tar.gz | cut -d' ' -f1)"
          sed -e "s/{{VERSION}}/$VERSION/g" \
              -e "s|{{URL_MACOS_ARM}}|https://github.com/sanohiro/align/releases/download/v$VERSION/alignc-macos-aarch64.tar.gz|g" \
              -e "s/{{SHA_MACOS_ARM}}/$SHA_MACOS_ARM/g" \
              .github/align.rb.template > release/align.rb

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum *.tar.gz *.deb > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: release/*
          body_path: RELEASE_NOTES_${{ steps.version.outputs.version }}.md
          generate_release_notes: true

      - name: Update Homebrew tap
        if: env.HAS_HOMEBREW_TAP_TOKEN == 'true'
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/sanohiro/homebrew-align.git"
          mkdir -p homebrew-align/Formula
          cp release/align.rb homebrew-align/Formula/align.rb
          cd homebrew-align
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/align.rb
          git diff --cached --quiet || git commit -m "Update Align to $VERSION"
          git push

      - name: Build signed apt repository
        if: env.HAS_APT_GPG_PRIVATE_KEY == 'true'
        shell: bash
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_FPR="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$KEY_FPR"

          mkdir -p apt-repo/pool/main/a/alignc
          mkdir -p apt-repo/dists/stable/main/binary-amd64
          mkdir -p apt-repo/dists/stable/main/binary-arm64
          cp release/*.deb apt-repo/pool/main/a/alignc/

          cd apt-repo
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          dpkg-scanpackages --arch arm64 pool/ > dists/stable/main/binary-arm64/Packages
          gzip -9 -k dists/stable/main/binary-amd64/Packages
          gzip -9 -k dists/stable/main/binary-arm64/Packages

          cd dists/stable
          {
            echo "Origin: Align"
            echo "Label: Align"
            echo "Suite: stable"
            echo "Codename: stable"
            echo "Date: $(date -Ru)"
            echo "Architectures: amd64 arm64"
            echo "Components: main"
            echo "Description: Align compiler apt repository"
            echo "SHA256:"
            for FILE in main/binary-*/Packages*; do
              echo " $(sha256sum "$FILE" | cut -d' ' -f1) $(wc -c < "$FILE") $FILE"
            done
          } > Release
          gpg --batch --yes --local-user "$KEY_FPR" --armor --detach-sign -o Release.gpg Release
          gpg --batch --yes --local-user "$KEY_FPR" --armor --clearsign -o InRelease Release

          cd ../..
          gpg --batch --armor --export "$KEY_FPR" > align.gpg
          cp ../.github/install.sh .

      - name: Deploy apt repository to GitHub Pages
        if: env.HAS_APT_GPG_PRIVATE_KEY == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          publish_branch: gh-pages
          force_orphan: true
