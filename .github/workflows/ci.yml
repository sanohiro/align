name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.96.0
  OPENSSL_VERSION: 3.5.7
  OPENSSL_SHA256: a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8
  CARGO_TERM_COLOR: always

jobs:
  db-postgres:
    name: PostgreSQL integration (required)
    runs-on: ubuntu-24.04
    # Keep the server version explicit: this job is the non-skippable D4/Q2, D5/Q3, and D11/Q5a gate.
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: align
          POSTGRES_USER: align
          POSTGRES_PASSWORD: align
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U align -d align"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RUST_VERSION: 1.96.0
      ALIGN_DB_POSTGRES_REQUIRED: "1"
      ALIGN_DB_POSTGRES_URL: postgresql://align:align@127.0.0.1:5432/align
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Restore Cargo caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-db-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-db-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      - name: Install LLVM and database libraries
        shell: bash
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev clang-22 libclang-rt-22-dev \
            libpq-dev libsqlite3-dev libssl-dev zlib1g-dev libzstd-dev make perl
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=/usr/lib/llvm-22/bin/llvm-config" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Build compiler and runtime
        shell: bash
        run: scripts/cargo.sh build --workspace --locked

      - name: Print database evidence
        shell: bash
        run: |
          rustc --version
          "$LLVM_CONFIG" --version
          pg_config --version
          psql --version
          psql "$ALIGN_DB_POSTGRES_URL" -Atqc 'SHOW server_version'

      - name: Required-mode configuration self-test
        shell: bash
        run: |
          set +e
          env -u ALIGN_DB_POSTGRES_URL scripts/cargo.sh test --locked \
            -p align_driver --test pkg_db_q2 postgres_required_mode_requires_configuration -- --exact
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "required PostgreSQL mode accepted a missing URL" >&2
            exit 1
          fi

      - name: Required portable dual-driver integration
        shell: bash
        run: |
          scripts/cargo.sh test --locked -p align_driver --test pkg_db_q2 -- --nocapture

      - name: Required checked-metadata integration
        shell: bash
        run: |
          scripts/cargo.sh test --locked -p align_driver --test pkg_db_q3 -- --nocapture

      - name: Required migration lifecycle integration
        shell: bash
        run: |
          scripts/cargo.sh test --locked -p align_driver --test pkg_db_q5a -- --nocapture

      - name: Save Cargo caches
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-db-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            lint: true
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            lint: false
          - name: macOS Apple Silicon
            os: macos-15
            lint: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"

      # The pinned OpenSSL takes ~2 minutes to build from source; its output is
      # deterministic for a given version, so cache the installed prefix.
      - name: Restore OpenSSL cache
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/openssl-${{ env.OPENSSL_VERSION }}
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install LLVM and native libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev clang-22 libclang-rt-22-dev \
            libssl-dev zlib1g-dev libzstd-dev make perl
          OPENSSL_PREFIX="$RUNNER_TEMP/openssl-${OPENSSL_VERSION}"
          if [ ! -x "$OPENSSL_PREFIX/bin/openssl" ]; then
            curl -fsSLO \
              "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
            echo "${OPENSSL_SHA256}  openssl-${OPENSSL_VERSION}.tar.gz" | sha256sum -c -
            tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
            (
              cd "openssl-${OPENSSL_VERSION}"
              ./Configure --prefix="$OPENSSL_PREFIX" --libdir=lib shared no-tests
              make -j"$(nproc)"
              make install_sw
            )
          fi
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=/usr/lib/llvm-22/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$OPENSSL_PREFIX/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$OPENSSL_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$OPENSSL_PREFIX/bin" >> "$GITHUB_PATH"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Install LLVM and native libraries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm@22 openssl@3 zstd
          LLVM_PREFIX="$(brew --prefix llvm@22)"
          echo "LLVM_SYS_221_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=$LLVM_PREFIX/bin/llvm-config" >> "$GITHUB_ENV"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib:$(brew --prefix zstd)/lib" >> "$GITHUB_ENV"

      - name: Verify toolchain
        shell: bash
        run: |
          rustc --version
          "$LLVM_CONFIG" --version
          openssl version
          cc --version

      # Test-binary compilation dominates the bounded gate; restore build
      # artifacts from the last main run. Saving happens only on main (below),
      # so PR runs never spend wall-clock uploading a multi-gigabyte cache.
      - name: Restore Cargo caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-lint${{ matrix.lint }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-lint${{ matrix.lint }}-${{ env.RUST_VERSION }}-

      - name: Lint
        if: matrix.lint
        run: scripts/cargo.sh clippy --workspace --lib --bins --locked -- -D warnings

      - name: Lint ratchet
        if: matrix.lint
        run: bash scripts/lint-ratchet.sh

      - name: Build compiler and runtime
        if: ${{ !matrix.lint }}
        run: scripts/cargo.sh build --workspace --locked

      - name: Bounded PR test gate
        if: matrix.lint
        run: scripts/test-pr.sh

      # The lint job is the critical path; its release-profile check moved to
      # the nightly workflow, while the shorter ARM64/macOS jobs keep covering
      # the release build and packaged smoke test on every PR.
      - name: Build release compiler
        if: ${{ !matrix.lint }}
        run: scripts/cargo.sh build --locked --release -p align_runtime -p align_driver

      - name: Smoke test packaged command
        if: ${{ !matrix.lint }}
        shell: bash
        run: |
          ./target/release/alignc --version
          ./target/release/alignc build examples/hello.align
          ./hello

      - name: Save Cargo caches
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-lint${{ matrix.lint }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
