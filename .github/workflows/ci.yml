name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.96.0
  CARGO_INCREMENTAL: "0"
  OPENSSL_VERSION: 3.5.7
  OPENSSL_SHA256: a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8
  CARGO_TERM_COLOR: always

jobs:
  db-scope:
    name: CI change scope
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.scope.outputs.required }}
      reason: ${{ steps.scope.outputs.reason }}
      platform_required: ${{ steps.platform-scope.outputs.required }}
      platform_reason: ${{ steps.platform-scope.outputs.reason }}
      platform_scope: ${{ steps.platform-scope.outputs.scope }}
      platform_matrix: ${{ steps.platform-scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Classify database boundary changes
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            printf 'required=true\nreason=manual-dispatch\n' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$BASE_REF" != main ]; then
            printf 'required=true\nreason=non-main-base\n' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && gh api \
                 "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" | \
                 jq -e --arg head "$HEAD_SHA" --arg base "$GITHUB_REF_NAME" \
                   'any(.[]; .merged_at != null and .merge_commit_sha == $head and .base.ref == $base)' \
                   >/dev/null; then
            # The API, not the commit shape or message, establishes that this
            # exact main commit is the protected PR merge that already passed
            # the required check against GitHub's test merge.
            printf 'required=false\nreason=protected-pr-merge\n' >> "$GITHUB_OUTPUT"
          else
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
              TRUSTED_TIP="$(git rev-parse refs/remotes/origin/main)"
            else
              # A direct push is classified by machinery from the preceding
              # protected main revision, never by code introduced by the push.
              TRUSTED_TIP="$BASE_SHA"
            fi
            trusted_classifier="$RUNNER_TEMP/db-ci-scope.sh"
            if git show "$TRUSTED_TIP:scripts/db-ci-scope.sh" > "$trusted_classifier" 2>/dev/null; then
              chmod +x "$trusted_classifier"
              DB_CI_REPO_ROOT="$GITHUB_WORKSPACE" \
                "$trusted_classifier" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
            else
              # One-PR bootstrap: origin/main does not own the classifier yet.
              # Provisioning the service is the only trusted fallback.
              printf 'required=true\nreason=classifier-bootstrap\n' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Classify platform build scope
        id: platform-scope
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          full_matrix='[{"name":"Linux x86_64","os":"ubuntu-24.04","lint":true,"scope":"full"},{"name":"Linux ARM64","os":"ubuntu-24.04-arm","lint":false,"scope":"full"},{"name":"macOS Apple Silicon","os":"macos-15","lint":false,"scope":"full"}]'
          light_matrix='[{"name":"Linux x86_64","os":"ubuntu-24.04","lint":true,"scope":"light"}]'
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            printf 'required=true\nreason=non-pull-request\n' >> "$GITHUB_OUTPUT"
            printf 'scope=full\n' >> "$GITHUB_OUTPUT"
            echo "matrix=$full_matrix" >> "$GITHUB_OUTPUT"
          elif [ "$BASE_REF" != main ]; then
            # A stacked PR's base branch is author-controlled. Never source
            # classifier code from it or let its child diff skip protected
            # platform checks; only pull requests targeting main may be light.
            printf 'required=true\nreason=non-main-base\n' >> "$GITHUB_OUTPUT"
            printf 'scope=full\n' >> "$GITHUB_OUTPUT"
            echo "matrix=$full_matrix" >> "$GITHUB_OUTPUT"
          else
            BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            TRUSTED_TIP="$(git rev-parse refs/remotes/origin/main)"
            trusted_classifier="$RUNNER_TEMP/pr-tier.sh"
            if git show "$TRUSTED_TIP:scripts/pr-tier.sh" > "$trusted_classifier" 2>/dev/null; then
              # shellcheck source=scripts/pr-tier.sh
              . "$trusted_classifier"
              if declare -F pr_tier_docs_only >/dev/null && \
                 pr_tier_docs_only "$BASE_SHA" "$HEAD_SHA"; then
                printf 'required=false\nreason=docs-only\n' >> "$GITHUB_OUTPUT"
                printf 'scope=none\n' >> "$GITHUB_OUTPUT"
                echo "matrix=$full_matrix" >> "$GITHUB_OUTPUT"
              elif declare -F pr_tier_platform_scope >/dev/null; then
                printf 'required=true\nreason=non-docs-only\n' >> "$GITHUB_OUTPUT"
                scope="$(pr_tier_platform_scope "$BASE_SHA" "$HEAD_SHA")"
                printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
                if [ "$scope" = light ]; then
                  echo "matrix=$light_matrix" >> "$GITHUB_OUTPUT"
                else
                  echo "matrix=$full_matrix" >> "$GITHUB_OUTPUT"
                fi
              else
                # One-PR bootstrap: origin/main's pr-tier.sh predates
                # pr_tier_platform_scope. Run the complete matrix until the
                # trusted base owns the function this PR is adding.
                printf 'required=true\nreason=classifier-bootstrap\n' >> "$GITHUB_OUTPUT"
                printf 'scope=full\n' >> "$GITHUB_OUTPUT"
                echo "matrix=$full_matrix" >> "$GITHUB_OUTPUT"
              fi
            else
              # The trusted base cannot prove this diff docs-only. Run the
              # complete matrix; the first PR adding machinery takes this arm.
              printf 'required=true\nreason=classifier-bootstrap\n' >> "$GITHUB_OUTPUT"
              printf 'scope=full\n' >> "$GITHUB_OUTPUT"
              echo "matrix=$full_matrix" >> "$GITHUB_OUTPUT"
            fi
          fi

  db-postgres:
    name: PostgreSQL integration (${{ matrix.db-shard }})
    needs: db-scope
    if: needs.db-scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db-shard:
          - catalog-stream
          - delivery-callbacks
          - vector-static
          - portable-pool
    # Keep both server images explicit. The ordinary service remains the no-extension
    # compatibility floor; VC1's isolated service proves the existing SQL-native pgvector path.
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: align
          POSTGRES_USER: align
          POSTGRES_PASSWORD: align
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U align -d align"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      pgvector:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: align_vector
          POSTGRES_USER: align
          POSTGRES_PASSWORD: align
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U align -d align_vector"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RUST_VERSION: 1.96.0
      ALIGN_DB_POSTGRES_REQUIRED: "1"
      ALIGN_DB_POSTGRES_URL: postgresql://align:align@127.0.0.1:5432/align
      ALIGN_DB_PGVECTOR_REQUIRED: "1"
      ALIGN_DB_PGVECTOR_URL: postgresql://align:align@127.0.0.1:5433/align_vector
      # Two binary processes with two libtest threads each keep the four-core
      # runner occupied without serializing a large owner such as q4b inside
      # one single-threaded process.
      ALIGN_GATE_JOBS: "2"
      ALIGN_APT_PACKAGES: >-
        llvm-22-dev clang-22 libclang-rt-22-dev lld-22
        libpq-dev postgresql-client-17
        libsqlite3-dev libssl-dev zlib1g-dev libzstd-dev make perl
      # Fail closed on the linker: `alignc` would otherwise silently fall back
      # to the system linker if lld-22 ever stopped being installed, and the
      # only symptom would be slower links nobody notices. Demanding it makes
      # that a red build instead (build-perf item 2).
      ALIGNC_LINKER: lld
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Restore Cargo caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The key and every restore-keys stage carry the root manifest hash.
          # `[profile.dev]` lives there, and changing it invalidates every Cargo
          # fingerprint in a restored `target` without deleting one byte of it:
          # cargo writes a second full generation of artifacts under new
          # `-C metadata` hashes beside the dead ones. Nightly run 35418220792
          # restored a 10.5 GB opt-level 0 target that way and filled the runner's
          # disk mid-build. A cache entry is also immutable, so a key fixed on the
          # lock file alone could never be replaced and every later run would keep
          # restoring artifacts it must rebuild from scratch. restore-keys match by
          # prefix, so the manifest hash sits ahead of the lock hash: that is what
          # gates the hash-free fallback stage on the profile as well.
          key: cargo-db-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-profile${{ hashFiles('Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-db-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-profile${{ hashFiles('Cargo.toml') }}-

      # The apt install costs ~23 s a run and only ~3 s of that is the 160 MB
      # download: `apt-get update` and two package-list resolutions dominate.
      # The resolved archive set is a pure function of the runner image and the
      # requested packages, so cache it and unpack it with dpkg, which reads no
      # package lists at all. A miss runs the identical full apt install.
      - name: Resolve the apt package cache entry
        id: apt-llvm
        shell: bash
        run: scripts/ci-apt-llvm.sh key >> "$GITHUB_OUTPUT"

      - name: Restore the apt package cache
        id: apt-llvm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.apt-llvm.outputs.path }}
          key: ${{ steps.apt-llvm.outputs.key }}

      - name: Configure the PostgreSQL client repository
        shell: bash
        run: scripts/ci-pgdg.sh

      - name: Install LLVM and database libraries
        shell: bash
        run: |
          scripts/ci-apt-llvm.sh install
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=/usr/lib/llvm-22/bin/llvm-config" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      # Saving only on main matches the Cargo caches: a PR branch never spends
      # its own wall clock uploading the archive set it just resolved.
      - name: Save the apt package cache
        if: github.ref == 'refs/heads/main' && steps.apt-llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.apt-llvm.outputs.path }}
          key: ${{ steps.apt-llvm.outputs.key }}

      - name: Print database evidence
        shell: bash
        run: |
          rustc --version
          "$LLVM_CONFIG" --version
          # The full apt.llvm.org snapshot, which a cache hit pins for the life
          # of the runner image. Logged so a snapshot difference is never read
          # as a code change.
          dpkg-query --show llvm-22-dev
          pg_config --version
          psql --version
          scripts/check-libpq-version.sh
          psql "$ALIGN_DB_POSTGRES_URL" -Atqc 'SHOW server_version'
          psql "$ALIGN_DB_PGVECTOR_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector'
          vector_version="$(psql "$ALIGN_DB_PGVECTOR_URL" -Atqc \
            "SELECT extversion FROM pg_catalog.pg_extension WHERE extname = 'vector'")"
          test "$vector_version" = "0.8.6"
          echo "pgvector $vector_version"

      # This exact-owner build also produces alignc and every align_runtime
      # crate type, including the static archive used by generated programs.
      # Keep it before the catalog-only negative controls so those controls
      # reuse this graph instead of triggering a second cold build.
      - name: Required database owner suites
        shell: bash
        run: scripts/run-db-suites.sh "${{ matrix.db-shard }}"

      - name: Required-mode configuration self-test
        if: matrix.db-shard == 'catalog-stream'
        shell: bash
        run: |
          scripts/run-quiet.sh --expect-failure \
            "database CI test: missing PostgreSQL URL" -- \
            env -u ALIGN_DB_POSTGRES_URL scripts/cargo.sh test --locked \
            -p align_driver --test pkg_db_q2 postgres_required_mode_requires_configuration -- --exact

          scripts/run-quiet.sh --expect-failure \
            "database CI test: missing pgvector URL" -- \
            env -u ALIGN_DB_PGVECTOR_URL scripts/cargo.sh test --locked \
            -p align_driver --test pkg_db_vc1 \
            pgvector_required_mode_requires_configuration -- --exact

      - name: Save Cargo caches
        if: github.ref == 'refs/heads/main' && matrix.db-shard == 'catalog-stream'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-db-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-profile${{ hashFiles('Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}

  db-required:
    name: PostgreSQL integration (required)
    needs:
      - db-scope
      - db-postgres
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce classified PostgreSQL result
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.db-scope.result }}
          DB_REQUIRED: ${{ needs.db-scope.outputs.required }}
          DB_RESULT: ${{ needs.db-postgres.result }}
          DB_REASON: ${{ needs.db-scope.outputs.reason }}
        run: |
          echo "scope=$SCOPE_RESULT required=$DB_REQUIRED database=$DB_RESULT reason=$DB_REASON"
          test "$SCOPE_RESULT" = success
          case "$DB_REQUIRED" in
            true) test "$DB_RESULT" = success ;;
            false) test "$DB_RESULT" = skipped ;;
            *) echo "database scope produced no valid decision" >&2; exit 1 ;;
          esac

  build-and-test:
    name: ${{ matrix.name }}
    needs: db-scope
    if: needs.db-scope.outputs.platform_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.db-scope.outputs.platform_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      ALIGN_APT_PACKAGES: >-
        llvm-22-dev clang-22 libclang-rt-22-dev lld-22
        libpq-dev libssl-dev zlib1g-dev libzstd-dev make perl
      # Fail closed on the linker per platform: the Linux legs must actually
      # get lld-22 (a missing package is a red build, not a silent fallback to
      # the slow linker), and macOS states the Apple linker explicitly, which
      # is also the only value Mach-O accepts. `matrix` is the one context a
      # job-level `env` can read here — `runner.os` is not available.
      ALIGNC_LINKER: ${{ startsWith(matrix.os, 'ubuntu') && 'lld' || 'system' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # Fast (no cargo) and needs nothing beyond the checkout, so it runs here
      # rather than after the toolchain install: keeps the pr-tier.sh
      # staleness pins (PR_TIER_GATE_TESTS, PR_TIER_COMPILED_PROSE) and the
      # review-round/tier fixtures actually enforced instead of only ever
      # running when someone remembers to run it locally.
      - name: PR workflow self-test
        if: matrix.lint
        shell: bash
        run: bash scripts/test-pr-workflow.sh

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"

      # The pinned OpenSSL takes ~2 minutes to build from source; its output is
      # deterministic for a given version, so cache the installed prefix.
      - name: Restore OpenSSL cache
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/openssl-${{ env.OPENSSL_VERSION }}
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      # See the db-postgres job: the archive set is cached and unpacked with
      # dpkg instead of re-resolved through apt every run. Only the x86_64 job
      # caches it — ARM64 finishes in about half the critical path's time, so
      # a third entry would spend repository cache quota the Cargo caches use
      # far more profitably, and its plain install keeps the uncached path
      # exercised on every run.
      - name: Resolve the apt package cache entry
        id: apt-llvm
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: scripts/ci-apt-llvm.sh key >> "$GITHUB_OUTPUT"

      - name: Restore the apt package cache
        id: apt-llvm-cache
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.apt-llvm.outputs.path }}
          key: ${{ steps.apt-llvm.outputs.key }}

      - name: Install LLVM and native libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/ci-pgdg.sh
          scripts/ci-apt-llvm.sh install
          OPENSSL_PREFIX="$RUNNER_TEMP/openssl-${OPENSSL_VERSION}"
          if [ ! -x "$OPENSSL_PREFIX/bin/openssl" ]; then
            curl -fsSLO \
              "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
            echo "${OPENSSL_SHA256}  openssl-${OPENSSL_VERSION}.tar.gz" | sha256sum -c -
            tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
            (
              cd "openssl-${OPENSSL_VERSION}"
              ./Configure --prefix="$OPENSSL_PREFIX" --libdir=lib shared no-tests
              make -j"$(nproc)"
              make install_sw
            )
          fi
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=/usr/lib/llvm-22/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$OPENSSL_PREFIX/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$OPENSSL_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$OPENSSL_PREFIX/bin" >> "$GITHUB_PATH"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      # Saving only on main matches the Cargo caches: a PR branch never spends
      # its own wall clock uploading the archive set it just resolved.
      - name: Save the apt package cache
        if: runner.os == 'Linux' && runner.arch == 'X64' && github.ref == 'refs/heads/main' && steps.apt-llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.apt-llvm.outputs.path }}
          key: ${{ steps.apt-llvm.outputs.key }}

      - name: Install LLVM and native libraries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm@22 openssl@3 libpq zstd
          LLVM_PREFIX="$(brew --prefix llvm@22)"
          LIBPQ_PREFIX="$(brew --prefix libpq)"
          echo "LLVM_SYS_221_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=$LLVM_PREFIX/bin/llvm-config" >> "$GITHUB_ENV"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$LIBPQ_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LIBRARY_PATH=$LIBPQ_PREFIX/lib:$(brew --prefix openssl@3)/lib:$(brew --prefix zstd)/lib" >> "$GITHUB_ENV"

      - name: Verify toolchain
        shell: bash
        run: |
          rustc --version
          "$LLVM_CONFIG" --version
          openssl version
          cc --version
          scripts/check-libpq-version.sh
          # The full apt.llvm.org snapshot, which a cache hit pins for the life
          # of the runner image. Logged so an x86_64/ARM64 snapshot difference
          # is never read as a code change.
          if [ "$RUNNER_OS" = Linux ]; then
            dpkg-query --show llvm-22-dev
          fi

      # Test-binary compilation dominates the bounded gate; restore build
      # artifacts from the last main run. Saving happens only on main (below),
      # so PR runs never spend wall-clock uploading a multi-gigabyte cache.
      - name: Restore Cargo caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            target/clippy
          # The key and every restore-keys stage carry the root manifest hash.
          # `[profile.dev]` lives there, and changing it invalidates every Cargo
          # fingerprint in a restored `target` without deleting one byte of it:
          # cargo writes a second full generation of artifacts under new
          # `-C metadata` hashes beside the dead ones. Nightly run 35418220792
          # restored a 10.5 GB opt-level 0 target that way and filled the runner's
          # disk mid-build. A cache entry is also immutable, so a key fixed on the
          # lock file alone could never be replaced and every later run would keep
          # restoring artifacts it must rebuild from scratch. restore-keys match by
          # prefix, so the manifest hash sits ahead of the lock hash: that is what
          # gates the hash-free fallback stage on the profile as well.
          key: cargo-${{ runner.os }}-${{ runner.arch }}-lint${{ matrix.lint }}-${{ env.RUST_VERSION }}-openssl${{ env.OPENSSL_VERSION }}-profile${{ hashFiles('Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-lint${{ matrix.lint }}-${{ env.RUST_VERSION }}-openssl${{ env.OPENSSL_VERSION }}-profile${{ hashFiles('Cargo.toml') }}-

      # actions/checkout stamps every tracked file's mtime with the checkout
      # time, so Cargo's fingerprint sees every workspace crate as changed
      # even though the restored target/ above is unpacked with its original
      # mtimes intact (actions/cache preserves the tar's timestamps). Restore
      # each source file's mtime from the commit that last touched it so the
      # fingerprint cache actually hits. Soundness: the cache carries the SHA
      # it was built from (target/.align-cache-rev, written before "Save Cargo
      # caches"), and every path whose content differs between that tree and
      # the checked-out tree is reset to `now` afterward. A commit timestamp
      # cannot bound staleness: an old commit merged after the cache was saved
      # is still newer than the artifacts. Without the marker (an older cache,
      # a cache miss) restoration is skipped and checkout mtimes stand.
      - name: Restore source mtimes from Git
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          marker=target/.align-cache-rev
          if [ ! -s "$marker" ]; then
            echo "restore-mtime: skipped, the restored cache carries no source revision"
            exit 0
          fi
          rev="$(tr -d '[:space:]' < "$marker")"
          if ! git cat-file -e "$rev^{commit}" 2>/dev/null; then
            echo "restore-mtime: skipped, cache revision $rev is not in this history"
            exit 0
          fi
          echo "restore-mtime: cache built from $rev"
          python3 scripts/restore-mtime.py --changed "$rev" "$HEAD_SHA"

      # Clippy keeps its own target dir exactly as scripts/pre-pr.sh does: clippy
      # and build/test record incompatible fingerprints, and sharing one dir
      # would invalidate the restored cache in both directions every run.
      - name: Lint
        if: matrix.lint
        env:
          CARGO_TARGET_DIR: target/clippy
        run: >
          scripts/run-quiet.sh "CI lint: Clippy" --
          scripts/cargo.sh clippy --workspace --lib --bins --locked -- -D warnings

      - name: Lint ratchet
        if: matrix.lint
        run: bash scripts/lint-ratchet.sh

      - name: Build compiler and runtime
        if: ${{ !matrix.lint }}
        run: >
          scripts/run-quiet.sh "CI build: workspace" --
          scripts/cargo.sh build --workspace --locked

      - name: TCP writer SIGPIPE regressions (macOS)
        if: runner.os == 'macOS' && matrix.scope != 'light'
        timeout-minutes: 15
        run: >
          scripts/run-quiet.sh "CI test: TCP writer SIGPIPE" --
          scripts/cargo.sh test -p align_runtime --lib --locked tcp_writer_

      - name: Owned-JSON boundary regressions (macOS)
        if: runner.os == 'macOS' && matrix.scope != 'light'
        run: >
          scripts/run-quiet.sh "CI test: owned JSON" --
          scripts/cargo.sh test -p align_driver --test m5_owned_json --locked

      - name: CPU configuration and byte-execution regressions
        if: matrix.scope != 'light'
        timeout-minutes: 15
        shell: bash
        run: >
          scripts/run-quiet.sh "CI test: codegen performance contracts" --
          scripts/test-codegen-performance.sh --ci-core

      - name: Native process and signal regressions
        if: matrix.scope != 'light'
        timeout-minutes: 15
        run: >
          scripts/run-quiet.sh "CI test: native process and signals" --
          scripts/test-process-native.sh

      - name: Retained filesystem and identity regressions (macOS)
        if: runner.os == 'macOS' && matrix.scope != 'light'
        timeout-minutes: 15
        run: >
          scripts/run-quiet.sh "CI test: retained filesystem and identity" --
          scripts/test-fs-observations.sh

      - name: Client composition and regular-file admission regressions
        if: matrix.scope != 'light'
        timeout-minutes: 15
        run: >
          scripts/run-quiet.sh "CI test: client admission" --
          scripts/test-client-admission.sh

      - name: Bounded PR test gate
        if: matrix.lint
        env:
          ALIGN_GATE_BUILD_ONLY: ${{ matrix.scope == 'light' && '1' || '' }}
        run: scripts/test-pr.sh

      # The lint job is the critical path; its release-profile check moved to
      # the nightly workflow, while the shorter ARM64/macOS jobs keep covering
      # the release build and packaged smoke test on every PR.
      - name: Build release compiler
        if: ${{ !matrix.lint && matrix.scope != 'light' }}
        run: >
          scripts/run-quiet.sh "CI build: release compiler" --
          scripts/cargo.sh build --locked --release
          -p align_runtime -p align_driver -p align_repl

      - name: Smoke test packaged command
        if: ${{ !matrix.lint && matrix.scope != 'light' }}
        shell: bash
        run: |
          ./target/release/alignc --version
          ./target/release/alignc build examples/hello.align
          ./hello
          # The release flow ships align-repl beside alignc, and that wiring only
          # runs on a tag. Exercising the pair here is what keeps a packaging
          # break from being discovered at release time.
          ./target/release/align-repl --version
          printf '40 + 2\n:quit\n' | ./target/release/align-repl | grep -x 42

      # The saved cache names the tree it was built from so the next run's
      # "Restore source mtimes from Git" can invalidate exactly what changed.
      - name: Record the cache's source revision
        if: github.ref == 'refs/heads/main'
        run: git rev-parse HEAD > target/.align-cache-rev

      - name: Save Cargo caches
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            target/clippy
          key: cargo-${{ runner.os }}-${{ runner.arch }}-lint${{ matrix.lint }}-${{ env.RUST_VERSION }}-openssl${{ env.OPENSSL_VERSION }}-profile${{ hashFiles('Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}

  platform-required:
    name: Platform CI (required)
    needs:
      - db-scope
      - build-and-test
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce classified platform result
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.db-scope.result }}
          PLATFORM_REQUIRED: ${{ needs.db-scope.outputs.platform_required }}
          PLATFORM_RESULT: ${{ needs.build-and-test.result }}
          PLATFORM_REASON: ${{ needs.db-scope.outputs.platform_reason }}
        run: |
          echo "scope=$SCOPE_RESULT required=$PLATFORM_REQUIRED platform=$PLATFORM_RESULT reason=$PLATFORM_REASON"
          test "$SCOPE_RESULT" = success
          case "$PLATFORM_REQUIRED" in
            true) test "$PLATFORM_RESULT" = success ;;
            false) test "$PLATFORM_RESULT" = skipped ;;
            *) echo "platform scope produced no valid decision" >&2; exit 1 ;;
          esac
