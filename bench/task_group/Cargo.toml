[package]
name = "task-group-record-bench"
version = "0.0.0"
edition = "2021"
publish = false

# Keep the benchmark isolated from the parent workspace. It drives the shipped task-group C ABI
# directly so the comparison prices record layout and scheduler work, not compiler test harnesses.
[workspace]

[dependencies]
align_runtime = { path = "../../crates/align_runtime", features = ["task-group-probe"] }

[profile.release]
opt-level = 3
# Keep the normal Rust-to-runtime C-ABI boundary visible; this probe is not an rt-lto measurement.
lto = false
codegen-units = 1
