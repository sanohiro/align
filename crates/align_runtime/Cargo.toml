[package]
name = "align_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

# Thin native runtime linked into generated code (docs/impl/06-runtime-std.md).
# `lib` keeps the in-tree unit tests; `staticlib` produces libalign_runtime.a, which
# the driver links into every generated executable (M1: the builtin `print`).
# `cdylib` produces libalign_runtime.so — used only to link the runtime into a *Rust* binary
# (the `bench/json_soa` serde harness) over a clean C-ABI boundary: linking the staticlib (which
# bundles its own std) into another std binary duplicates std symbols, but a cdylib hides its std.
[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
# Off by default and zero-cost when off: gate allocation counters plus the requested-live-byte
# measurement used by the `pkg.ws` resource owner. Also used by `bench/adaptive_sort` to prove the
# short-size scratch matrix allocates only the materialize buffer(s). Not a runtime capability — a
# measurement aid whose extra exports never enter the compiler registry.
alloc-count = []
# Measurement aid for `bench/par_map`: expose a caller-only switch so the threshold probe can
# compare the pooled kernel with the same materializing `par_map` kernel without the scheduler.
par-map-probe = []
# Measurement aid for `bench/task_group`: expose an idle barrier so timing arms do not inherit
# detached no-op helper jobs from the persistent pool. This is not a runtime capability.
task-group-probe = []
# Measurement aid for `bench/crypto_asymmetric`: count live published key shells and the exact
# wrapper-owned clear-free DER allocations during construction. Off by default and not a gate.
crypto-asymmetric-probe = []

[dependencies]
align_hash = { path = "../align_hash" }
libc = "0.2"
memchr = "2.8.2"
regex = "1.13.1"
